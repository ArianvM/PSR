<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Control Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5; /* Light grey background */
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .status-bar {
            font-size: 1.2rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 30px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 0 auto 20px auto;
            padding: 20px;
            width: 90%;
            max-width: 1000px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
        }

        /* Container to keep charts responsive */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Motor Control Dashboard</h1>
    <div class="status-bar">
        Ref: <span id="val-ref">0</span> | 
        Pos: <span id="val-pos">0</span> | 
        PWM: <span id="val-pwm">0</span>%
    </div>

    <div class="card">
        <div class="card-title">Position Control (Encoder Ticks)</div>
        <div class="chart-container">
            <canvas id="positionChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="card-title">PWM Output (%)</div>
        <div class="chart-container">
            <canvas id="pwmChart"></canvas>
        </div>
    </div>

    <script>
        // --- 1. SETUP POSITION CHART ---
        const ctxPos = document.getElementById('positionChart').getContext('2d');
        const positionChart = new Chart(ctxPos, {
            type: 'line',
            data: {
                labels: [], // Time labels
                datasets: [
                    {
                        label: 'Requested (Ref)',
                        data: [],
                        borderColor: 'rgba(255, 99, 132, 1)', // Orange/Red
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 2,
                        tension: 0.1,
                        pointRadius: 0 // Hide dots for cleaner look
                    },
                    {
                        label: 'Actual Position',
                        data: [],
                        borderColor: 'rgba(54, 162, 235, 1)', // Blue
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderWidth: 2,
                        tension: 0.1,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, // Disable animation for performance
                scales: {
                    x: { display: false } // Hide X axis labels to save space
                }
            }
        });

        // --- 2. SETUP PWM CHART ---
        const ctxPwm = document.getElementById('pwmChart').getContext('2d');
        const pwmChart = new Chart(ctxPwm, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'PWM Duty',
                    data: [],
                    borderColor: 'rgba(75, 192, 192, 1)', // Teal
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderWidth: 2,
                    fill: true,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { min: -100, max: 100 } // Assuming PWM is 0-100%
                }
            }
        });

        // --- 3. THE DATA LOOP ---
        function fetchData() {
            // This URL matches the C code: if (strncmp(resource, "/api_data", 9) == 0)
            fetch('/api_data')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // console.log("Data received:", data); // Uncomment for debugging

                    // A. Update Text Values at Top
                    document.getElementById('val-ref').innerText = data.ref;
                    document.getElementById('val-pos').innerText = data.pos;
                    document.getElementById('val-pwm').innerText = data.pwm;

                    // B. Update Charts
                    const now = new Date().toLocaleTimeString();

                    // Keep chart buffer size small (50 points) so browser doesn't crash
                    if (positionChart.data.labels.length > 50) {
                        positionChart.data.labels.shift();
                        positionChart.data.datasets[0].data.shift();
                        positionChart.data.datasets[1].data.shift();
                        
                        pwmChart.data.labels.shift();
                        pwmChart.data.datasets[0].data.shift();
                    }

                    // Push new data
                    positionChart.data.labels.push(now);
                    positionChart.data.datasets[0].data.push(data.ref);
                    positionChart.data.datasets[1].data.push(data.pos);
                    positionChart.update();

                    pwmChart.data.labels.push(now);
                    pwmChart.data.datasets[0].data.push(data.pwm);
                    pwmChart.update();
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    // Optional: Turn text red if connection is lost
                    document.querySelector('.status-bar').style.color = 'red';
                });
        }

        // --- 4. START THE LOOP (100ms = 10Hz) ---
        setInterval(fetchData, 100);

    </script>
</body>
</html>
