<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32 Motor Control</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; padding: 20px; }
        h1 { margin-bottom: 10px; }
        .status-bar { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; }
        
        .graph-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 0 auto 20px auto;
            padding: 10px;
            width: 90%;
            max-width: 800px;
        }
        
        canvas { width: 100%; height: 300px; display: block; }
        
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 5px; font-size: 0.9rem; }
        .legend-item { display: flex; align-items: center; }
        .color-box { width: 15px; height: 15px; margin-right: 5px; border-radius: 3px; }
        
        /* Specific Colors */
        .color-ref { background-color: #FF5733; } /* Red/Orange */
        .color-pos { background-color: #3375FF; } /* Blue */
        .color-pwm { background-color: #28B463; } /* Green */
    </style>
</head>
<body>

    <h1>Motor Control Dashboard</h1>
    
    <div class="status-bar">
        Ref: <span id="val-ref">0</span> | 
        Pos: <span id="val-pos">0</span> | 
        PWM: <span id="val-pwm">0</span>%
    </div>

    <div class="graph-container">
        <h3>Position Control (Encoder Ticks)</h3>
        <canvas id="posChart"></canvas>
        <div class="legend">
            <div class="legend-item"><div class="color-box color-ref"></div>Requested (Ref)</div>
            <div class="legend-item"><div class="color-box color-pos"></div>Actual Position</div>
        </div>
    </div>

    <div class="graph-container">
        <h3>PWM Output (%)</h3>
        <canvas id="pwmChart"></canvas>
        <div class="legend">
            <div class="legend-item"><div class="color-box color-pwm"></div>Duty Cycle</div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const POLLING_RATE_MS = 50;   // Fetch data every 50ms
    const HISTORY_SECONDS = 2;    // Keep 2 seconds of history
    const MAX_POINTS = (HISTORY_SECONDS * 1000) / POLLING_RATE_MS; 

    // --- DATA STORAGE ---
    const dataRef = new Array(MAX_POINTS).fill(0);
    const dataPos = new Array(MAX_POINTS).fill(0);
    const dataPwm = new Array(MAX_POINTS).fill(0);

    // --- SETUP CANVAS ---
    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        // Handle high-DPI displays for crisp lines
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        return { canvas, ctx, width: rect.width, height: rect.height };
    }

    const graphPos = setupCanvas('posChart');
    const graphPwm = setupCanvas('pwmChart');

    // --- MAIN LOOP ---
    setInterval(fetchData, POLLING_RATE_MS);

    function fetchData() {
        // This URL matches the C code: if(strncmp(resource, "/api_data", 9) == 0)
        fetch('/api_data')
            .then(response => response.json())
            .then(json => {
                // Update HTML text values
                document.getElementById('val-ref').innerText = json.ref;
                document.getElementById('val-pos').innerText = json.pos;
                document.getElementById('val-pwm').innerText = json.pwm;

                // Update Data Arrays (Shift old out, push new in)
                dataRef.push(json.ref); dataRef.shift();
                dataPos.push(json.pos); dataPos.shift();
                dataPwm.push(json.pwm); dataPwm.shift();

                // Draw Graphs
                drawGraph(graphPos, [dataRef, dataPos], ['#FF5733', '#3375FF'], true); // Auto-scale
                drawGraph(graphPwm, [dataPwm], ['#28B463'], false); // Fixed scale -100 to 100
            })
            .catch(err => console.error("Error fetching data:", err));
    }

    // --- DRAWING ENGINE ---
    function drawGraph(graphObj, datasets, colors, autoScale) {
        const { ctx, width, height } = graphObj;
        ctx.clearRect(0, 0, width, height);

        // Draw Grid Background
        ctx.strokeStyle = '#eee';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<width; i+=width/10) { ctx.moveTo(i,0); ctx.lineTo(i,height); } // Vertical
        for(let i=0; i<height; i+=height/4) { ctx.moveTo(0,i); ctx.lineTo(width,i); } // Horizontal
        ctx.stroke();

        // Determine Scale (Min/Max)
        let min, max;
        if (autoScale) {
            const allValues = datasets.flat();
            min = Math.min(...allValues);
            max = Math.max(...allValues);
            // Add slight padding so lines don't touch edges
            const range = max - min || 100; // avoid div by zero
            min -= range * 0.1;
            max += range * 0.1;
        } else {
            // Fixed scale for PWM (-100 to 100)
            min = -110;
            max = 110;
        }

        const mapY = (val) => height - ((val - min) / (max - min)) * height;
        const stepX = width / (MAX_POINTS - 1);

        // Draw Center Zero Line (useful for PWM)
        if (min < 0 && max > 0) {
            const zeroY = mapY(0);
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, zeroY);
            ctx.lineTo(width, zeroY);
            ctx.stroke();
        }

        // Draw Lines
        datasets.forEach((data, index) => {
            ctx.strokeStyle = colors[index];
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = i * stepX;
                const y = mapY(data[i]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        });
    }
</script>
</body>
</html>
